# XcodeGen spec. The .xcodeproj is generated on the CI runner, so nothing in
# this repo needs a Mac to have touched it.
#
# One target, no extensions, and no entitlements file — dropping the widget
# means no App Group, which is exactly why free-tier signing works here.

name: Today

options:
  objectVersion: 56
  # iOS 26 is where Liquid Glass lives, and this app is sideloaded to
  # exactly one phone - so dropping older targets costs nothing and the
  # system chrome adopts the current design language for free.
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Today:
    type: application
    platform: iOS
    sources:
      # Info.plist must be excluded here. Leaving it in makes XcodeGen add it to
      # Copy Bundle Resources while INFOPLIST_FILE also targets it, and two
      # build commands writing the same path fails the build after linking —
      # which is exactly how we ended up with a bundle holding only the binary.
      - path: App
        excludes:
          # INFOPLIST_FILE already targets this; leaving it in sources makes
          # XcodeGen also add it to Copy Bundle Resources.
          - Info.plist

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shreyansh.today
        PRODUCT_NAME: Today
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
