name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # xcode-select does not reliably stick on the runner, but xcodebuild
      # always honours DEVELOPER_DIR.
      - name: Pick newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$LATEST" ] || LATEST=/Applications/Xcode.app
          echo "DEVELOPER_DIR=$LATEST/Contents/Developer" >> "$GITHUB_ENV"
          "$LATEST/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # pipefail matters: without it the pipeline reports tail's status, so a
      # failing xcodebuild looks like success and a half-built bundle gets
      # shipped.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Today.xcodeproj \
            -scheme Today \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            2>&1 | tee build.log | grep -Ev '^\s*(export|cd |/usr/bin|builtin-)' | tail -60

      - name: Show errors
        if: failure()
        run: |
          echo "--- errors ---"
          grep -nE "error:|error |failed|Multiple commands|does not exist|actool" build.log | head -60 || true
          echo "--- tail ---"
          tail -80 build.log || true

      # An IPA is a zip with the .app inside a Payload/ directory. Built
      # unsigned on purpose — your sideloader re-signs it with your own cert.
      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          echo "app: $APP"
          echo "--- bundle contents ---"
          ls -la "$APP"
          test -f "$APP/Info.plist" || {
            echo "FATAL: Info.plist missing from the app bundle."
            echo "It would install as Unknown.app and fail to map."
            exit 1
          }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist"
          echo "VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" >> "$GITHUB_ENV"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry Today.ipa Payload && rm -rf Payload
          ls -lh Today.ipa

      # Artifact downloads are streamed zips, which iOS Files refuses to open
      # ("Bad message"). A release asset is a direct .ipa link instead, so the
      # phone downloads something it can hand straight to a sideloader.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          # The commit subject on the first line, because that line is what
          # SideStore shows against the version - boilerplate there told the
          # reader nothing about what changed.
          git log -1 --pretty=%s > notes.md
          printf '\nUnsigned IPA. A sideloader re-signs it on install.\n' >> notes.md
          # What is actually inside the IPA, for tools/source.mjs to read. A
          # SideStore source has to state the bundle's own version exactly;
          # reading it back out of the release title works until the title
          # changes shape, and the cost of being wrong is every install
          # failing with "the download version doesn't match".
          printf '\nbundle %s (%s)\n' "$VERSION" "${{ github.run_number }}" >> notes.md
          gh release create "$TAG" out/Today.ipa \
            --title "Today $VERSION ($TAG)" \
            --notes-file notes.md \
            --latest
          echo "### Download Today.ipa from the release: $TAG" >> "$GITHUB_STEP_SUMMARY"

      # Every push to main cuts a release, so the list reached 77 of them - 35
      # MB of builds nobody would install again, and a page nobody could read.
      # Five is enough to roll back to when something is wrong on the phone,
      # which matters here because there is no way to check a build locally.
      #
      # build-19 is kept forever. It is the first release this project ever
      # cut and the owner wants to be able to look back at it.
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FIRST=build-19
          gh release list -L 200 --json tagName -q '.[].tagName' \
            | grep -E '^build-[0-9]+$' \
            | sort -t- -k2 -n -r \
            | tail -n +6 \
            | grep -vx "$FIRST" \
            | while read -r tag; do
                echo "pruning $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
