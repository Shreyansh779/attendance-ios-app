name: Build probe IPA

on:
  workflow_dispatch:
    inputs:
      bundle_prefix:
        description: 'Bundle prefix, e.g. com.shreyansh (must be unique to you)'
        required: true
        default: 'com.CHANGEME'

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Set bundle prefix
        run: |
          sed -i '' "s|BUNDLE_PREFIX: com.CHANGEME|BUNDLE_PREFIX: ${{ inputs.bundle_prefix }}|" project.yml
          grep -n "BUNDLE_PREFIX" project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project AppGroupProbe.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      # An IPA is a zip with the .app inside a Payload/ directory. Built
      # unsigned on purpose: your sideloader re-signs it with your own cert,
      # and what it does to the entitlements is exactly what we are measuring.
      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          echo "app: $APP"
          echo "--- embedded extensions ---"
          ls "$APP/PlugIns" || echo "NO PlugIns DIRECTORY - widget was not embedded"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry AppGroupProbe.ipa Payload && rm -rf Payload
          ls -lh AppGroupProbe.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AppGroupProbe-ipa
          path: out/AppGroupProbe.ipa
          if-no-files-found: error
