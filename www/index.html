<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Today</title>
<style>
  /* No borders, no hairline rules, nothing under an 18px radius. Separation is
     carried by space and tone. The typeface is rounded too, so the letterforms
     do not fight the shapes. */
  :root{
    --bg:#191C23;
    --sur:#22262F;
    --sur-dim:#1E2129;
    --sur-live:#2C4B3E;
    --sur-vr:#332A38;
    --sur-lo:#3A2C2B;
    --drawer:#1E222A;
    --track:#2C313C;

    --ink:#EDEFF3;
    --ink-2:#9AA3B3;
    --ink-3:#7D8698;
    --ink-4:#5C6474;

    --mint:#6FD4A6;
    --mint-hi:#8BE3B8;
    --mint-dim:#6FBF9A;
    --coral:#F08A70;
  }

  *{box-sizing:border-box;margin:0;padding:0;border:0;-webkit-text-size-adjust:100%}

  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--ink);
    font:400 17px/1.4 ui-rounded,"SF Pro Rounded","Varela Round",-apple-system,system-ui,sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;background:none}

  #app{
    height:100%;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px);
  }

  /* ------------------------------------------------------------- header -- */
  .hd{display:flex;align-items:center;gap:14px;padding:2px 2px 0;flex:none}
  .burger{
    width:40px;height:40px;border-radius:999px;background:var(--sur);flex:none;
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;
  }
  .burger:active{background:var(--sur-live)}
  .burger i{width:15px;height:2px;border-radius:999px;background:var(--ink-2);display:block}
  .hd h1{font-size:16px;font-weight:600;color:var(--ink-3);letter-spacing:-.01em}
  .hd em{margin-left:auto;font-style:normal;font-size:14px;color:var(--ink-4);font-weight:500}

  #status{
    flex:none;margin-top:14px;background:#33302A;border-radius:22px;
    padding:15px 18px;font-size:14.5px;line-height:1.4;color:#E8CE9C;font-weight:500;
  }
  #status[hidden]{display:none}

  /* --------------------------------------------------------------- home -- */
  .view{flex:1;min-height:0;display:flex;flex-direction:column}
  .view.scrolls{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
  .view.scrolls::-webkit-scrollbar{display:none}

  .big{margin-top:auto;padding:0 4px}
  .tag{
    display:inline-flex;align-items:center;gap:8px;border-radius:999px;
    background:var(--sur-live);color:var(--mint);
    padding:8px 16px;font-size:13.5px;font-weight:600;margin-bottom:20px;
  }
  .tag i{width:7px;height:7px;border-radius:999px;background:var(--mint);display:block}
  .tag.soon{background:#232833;color:#93A0B4}
  .tag.soon i{background:var(--ink-4)}

  .rm{font-size:92px;font-weight:700;letter-spacing:-.055em;line-height:.85}
  .rm.word{font-size:52px;letter-spacing:-.035em}
  .sj{margin-top:20px;font-size:21px;font-weight:500;line-height:1.28;max-width:20ch}
  .mt{margin-top:9px;font-size:16px;color:var(--ink-3);font-weight:500}

  /* This class's own slack — the number you actually weigh before skipping. */
  .own{margin-top:26px;background:var(--sur);border-radius:28px;padding:19px 22px}
  .own .r1{display:flex;align-items:baseline;gap:14px}
  .own .n{font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:.9;color:var(--mint-hi)}
  .own.lo .n{color:var(--coral)}
  .own .c{font-size:14.5px;font-weight:500;color:var(--ink-2);line-height:1.32;max-width:20ch}
  .own .r2{margin-top:14px;display:flex;align-items:center;gap:12px}
  .own .pc{font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}

  .bar{flex:1;height:8px;border-radius:999px;background:var(--track);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:var(--mint)}
  .lo .bar i{background:var(--coral)}

  .caps{display:flex;gap:7px;margin-top:22px;flex:none}
  .cp{
    flex:1;min-width:0;background:var(--sur);border-radius:20px;padding:13px 4px;
    display:flex;flex-direction:column;align-items:center;gap:5px;
  }
  .cp b{font-size:13.5px;font-weight:700;letter-spacing:-.02em}
  .cp span{font-size:11px;color:var(--ink-3);font-weight:500;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cp.on{background:var(--sur-live)}
  .cp.on b{color:var(--mint-hi)}
  .cp.on span{color:var(--mint-dim)}
  .cp.was{background:var(--sur-dim)}
  .cp.was b,.cp.was span{color:var(--ink-4)}

  /* -------------------------------------------------------- list screens -- */
  .ttl{padding:20px 6px 16px;flex:none}
  .ttl h2{font-size:27px;font-weight:700;letter-spacing:-.03em}
  .ttl p{margin-top:4px;font-size:14.5px;color:var(--ink-3);font-weight:500}

  .lb{display:flex;gap:15px;background:var(--sur);border-radius:26px;padding:18px 20px;margin-bottom:9px}
  .lb.on{background:var(--sur-live);padding:22px 20px}
  .lb.was{background:var(--sur-dim)}
  .lb.vr{background:var(--sur-vr)}
  .lb-l{flex:none;width:58px}
  .lb-t{font-size:16px;font-weight:700;letter-spacing:-.02em;display:block}
  .lb-t i{font-style:normal;font-size:11.5px;font-weight:600;color:var(--ink-3);margin-left:2px}
  .lb.on .lb-t{color:var(--mint-hi)}
  .lb.was .lb-t,.lb.was .lb-s,.lb.was .lb-w{color:var(--ink-4)}
  .lb-n{display:block;margin-top:4px;font-size:11.5px;font-weight:600;color:var(--mint-dim)}
  .lb-s{font-size:16px;font-weight:600;line-height:1.26;display:block;letter-spacing:-.01em}
  .lb.on .lb-s{font-size:18px}
  .lb-w{display:block;margin-top:5px;font-size:14px;color:var(--ink-3);font-weight:500}
  .lb.on .lb-w{color:var(--mint-dim);font-weight:600}

  .ab{background:var(--sur);border-radius:24px;padding:17px 20px;margin-bottom:8px}
  .ab .r1{display:flex;align-items:baseline;gap:12px}
  .ab .nm{font-size:16px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
  .ab .v{margin-left:auto;font-size:22px;font-weight:700;letter-spacing:-.03em;
    color:var(--mint-hi);white-space:nowrap}
  .ab.lo .v{font-size:16px;color:var(--coral)}
  .ab.idle{background:var(--sur-dim)}
  .ab.idle .nm{color:var(--ink-4)}
  .ab.idle .v{font-size:15px;color:var(--ink-4)}
  .ab .r2{margin-top:13px;display:flex;align-items:center;gap:12px}
  .ab .mt2{font-size:13.5px;color:var(--ink-3);font-weight:500;white-space:nowrap}

  .callout{background:var(--sur-live);border-radius:28px;padding:20px 22px;margin-bottom:14px}
  .callout .n{font-size:38px;font-weight:700;letter-spacing:-.04em;line-height:.9;color:var(--mint-hi)}
  .callout .c{margin-top:10px;font-size:14.5px;color:#B6C9BF;font-weight:500;line-height:1.35}
  .callout.lo{background:var(--sur-lo)}
  .callout.lo .n{color:var(--coral)}
  .callout.lo .c{color:#CBB0A9}

  .empty{background:var(--sur);border-radius:28px;padding:26px 24px;
    font-size:16px;line-height:1.45;color:var(--ink-2);font-weight:500;margin:auto 0}

  /* ------------------------------------------------------------- drawer -- */
  .scrim{
    position:fixed;inset:0;z-index:8;background:rgba(9,11,15,.62);
    opacity:0;pointer-events:none;transition:opacity .26s ease;
  }
  .drawer{
    position:fixed;left:0;top:0;bottom:0;width:min(84vw,306px);z-index:9;
    background:var(--drawer);border-radius:0 34px 34px 0;
    padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 20px);
    display:flex;flex-direction:column;
    transform:translateX(-102%);transition:transform .3s cubic-bezier(.3,.8,.3,1);
  }
  body.menu .scrim{opacity:1;pointer-events:auto}
  body.menu .drawer{transform:none}
  @media (prefers-reduced-motion:reduce){
    .scrim,.drawer{transition:none}
  }

  .me{display:flex;align-items:center;gap:13px;padding:2px 4px 22px;flex:none}
  .av{
    width:44px;height:44px;border-radius:999px;background:var(--sur-live);color:var(--mint-hi);
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex:none;
  }
  .me b{display:block;font-size:16.5px;font-weight:600}
  .me span{display:block;font-size:13px;color:var(--ink-3);font-weight:500;margin-top:2px}

  .nav{display:flex;flex-direction:column;gap:7px;flex:none}
  .nv{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    background:var(--sur);border-radius:22px;padding:15px 18px;font-size:16px;font-weight:600;
  }
  .nv:active{background:#282D38}
  .nv.sel{background:var(--sur-live);color:var(--mint-hi)}
  .nv em{margin-left:auto;font-style:normal;font-size:14px;font-weight:600;color:var(--ink-3)}
  .nv.sel em{color:var(--mint-dim)}
  .glyph{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;gap:2px}
  .glyph i{background:var(--ink-2);border-radius:999px;display:block}
  .nv.sel .glyph i{background:var(--mint-hi)}

  .drawfoot{margin-top:auto;background:var(--sur);border-radius:24px;padding:17px 19px;flex:none}
  .drawfoot .n{font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:.9;color:var(--mint-hi)}
  .drawfoot.lo .n{color:var(--coral)}
  .drawfoot .c{margin-top:8px;font-size:13.5px;color:var(--ink-2);font-weight:500;line-height:1.35}
  .drawfoot .age{margin-top:12px;font-size:12.5px;color:var(--ink-4);font-weight:500}
</style>
</head>
<body>
  <div id="app">
    <div class="hd">
      <button class="burger" id="menu" aria-label="Menu"><i></i><i></i></button>
      <h1 id="title">Today</h1>
      <em id="sub"></em>
    </div>
    <div id="status" hidden></div>
    <div id="view" class="view"></div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <div class="me">
      <span class="av" id="initials">·</span>
      <span><b id="who">Today</b><span id="whosub">UPES dashboard</span></span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="drawfoot" id="drawfoot"></div>
  </aside>

  <script src="cordova.js"></script>
  <script src="app.js"></script>
</body>
</html>
