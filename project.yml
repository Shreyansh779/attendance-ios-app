# XcodeGen spec. The .xcodeproj is generated on the CI runner, so nothing in
# this repo needs a Mac to have touched it.
#
# EDIT ONE LINE: BUNDLE_PREFIX below. Everything else derives from it.

name: AppGroupProbe

options:
  # Pin the pbxproj format. Newer XcodeGen defaults to 77, which older
  # xcodebuild refuses to open.
  objectVersion: 56
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    BUNDLE_PREFIX: com.CHANGEME
    APP_GROUP_ID: group.$(BUNDLE_PREFIX).probe
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).probe
        PRODUCT_NAME: AppGroupProbe
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ProbeWidget
        embed: true
        codeSign: true

  ProbeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).probe.widget
        PRODUCT_NAME: ProbeWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
