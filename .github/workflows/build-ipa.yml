name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # xcode-select does not reliably stick on the runner, but xcodebuild
      # always honours DEVELOPER_DIR.
      - name: Pick newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$LATEST" ] || LATEST=/Applications/Xcode.app
          echo "DEVELOPER_DIR=$LATEST/Contents/Developer" >> "$GITHUB_ENV"
          "$LATEST/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Today.xcodeproj \
            -scheme Today \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | tail -40

      # An IPA is a zip with the .app inside a Payload/ directory. Built
      # unsigned on purpose — your sideloader re-signs it with your own cert.
      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          echo "app: $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry Today.ipa Payload && rm -rf Payload
          ls -lh Today.ipa

      # Artifact downloads are streamed zips, which iOS Files refuses to open
      # ("Bad message"). A release asset is a direct .ipa link instead, so the
      # phone downloads something it can hand straight to a sideloader.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/Today.ipa \
            --title "Today $TAG" \
            --notes "Unsigned IPA. Download Today.ipa and sideload it." \
            --latest
          echo "### Download Today.ipa from the release: $TAG" >> "$GITHUB_STEP_SUMMARY"
