# XcodeGen spec. The .xcodeproj is generated on the CI runner, so nothing in
# this repo needs a Mac to have touched it.
#
# One target, no extensions, and no entitlements file — dropping the widget
# means no App Group, which is exactly why free-tier signing works here.

name: Today

options:
  objectVersion: 56
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Today:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shreyansh.today
        PRODUCT_NAME: Today
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
